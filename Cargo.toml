[package]
name = "image-generation-mcp"
version = "0.1.0"
edition = "2024"
authors = ["EratoLab"]
description = "A Model Context Protocol (MCP) server for image generation with configurable backends"
license = "MIT"
repository = "https://github.com/EratoLab/image-generation-mcp"
readme = "README.md"
keywords = ["image", "generation", "mcp", "ai", "configurable"]
categories = ["multimedia", "api-bindings"]

[[bin]]
name = "mcp-server"
path = "src/bin/mcp_server.rs"
required-features = ["mcp-server"]

[features]
default = ["mcp-handler", "mcp-server"]
mcp-handler = ["rmcp/macros", "rmcp/server"]
mcp-server = [
    "mcp-handler",
    "rmcp/transport-io",
    "rmcp/transport-streamable-http-server",
    "tokio",
    "clap",
    "axum",
    "tokio-util",
    "env_logger",
]

[dependencies]
rmcp = "0.14"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.1"
async-trait = "0.1"
reqwest = { version = "0.13.1", features = ["json"] }
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "net",
    "signal",
    "fs",
], optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
axum = { version = "0.8", optional = true }
tokio-util = { version = "0.7", optional = true }
log = "0.4"
env_logger = { version = "0.11", optional = true }
toml = "0.8"
base64 = "0.22"
mime_guess = "2.0"
genai = { version = "0.6.0-beta.17-WIP", git = "https://github.com/EratoLab/rust-genai.git", rev = "102f18cb1f558fc1975bc413abc1bf206c75944a" }
