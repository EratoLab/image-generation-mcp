# Image Generation MCP Server Configuration

[server]
name = "image-generation-mcp"
version = "0.1.0"

[tool]
type = "mock"
static_image_path = "static/image_1.png"
tool_description = "Generate an image from a text prompt"

#[tool.mock]
#static_image_path = "static/image_1.png"

# GenAI backend example (OpenAI, Azure OpenAI-compatible, Ollama, or Gemini/Vertex)
